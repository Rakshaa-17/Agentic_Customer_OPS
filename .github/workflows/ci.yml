name: Customer Operations CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Deterministic Unit Tests (No API Key Required)
        env:
          PYTHONPATH: "."
        run: |
          pytest -v tests/test_mock_services.py tests/test_tools.py

      - name: Run Live LLM Integration Tests (If Secret Available)
        if: env.GROQ_API_KEY != ''
        env:
          PYTHONPATH: "."
          MODEL_PROVIDER: "groq"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          pytest -v tests/test_multi_agent_graph.py tests/test_hitl_approval.py
