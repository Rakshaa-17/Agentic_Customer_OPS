name: Customer Operations CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and dependencies
        run: |
          pip install uv
          uv pip install --system -r requirements.txt

      - name: Run Unit & Integration Tests
        env:
          PYTHONPATH: "."
          MODEL_PROVIDER: "groq"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          pytest -v tests/

      - name: Run 20-Scenario Benchmark Gate
        env:
          PYTHONPATH: "."
          MODEL_PROVIDER: "groq"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python eval/eval_harness.py baseline
